name: Workflow Health Audit

on:
  schedule:
    - cron: "42 12 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "docs/github-actions/**"
      - "docs/repository-governance/**"
      - "docs/prompts/**"
      - "scripts/platform-modernization/**"

permissions:
  contents: read

concurrency:
  group: workflow-health-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0

      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python -m pip install --upgrade pip
          python -m pip install yamllint

      - name: GitHub Actions syntax
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca  # v1.7.12

      - name: YAML configuration
        shell: bash
        run: yamllint .github/workflows/*.yml .yamllint

      - name: Shell scripts
        shell: bash
        run: shellcheck install.sh wireless.sh scripts/**/*.sh

      - name: Markdown documentation
        shell: bash
        run: npx --yes markdownlint-cli@0.45.0 README.md docs/**/*.md

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
