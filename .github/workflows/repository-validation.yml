name: Repository Validation

on:
  push:
    paths:
      - ".github/workflows/**"
      - ".markdownlint*"
      - ".yamllint"
      - "config/**"
      - "docs/**"
      - ".github/chatmodes/**"
      - ".github/prompts/**"
      - "scripts/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".markdownlint*"
      - ".yamllint"
      - "config/**"
      - "docs/**"
      - ".github/chatmodes/**"
      - ".github/prompts/**"
      - "scripts/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq shellcheck
          python -m pip install --upgrade pip
          python -m pip install pytest yamllint

      - name: Python tests
        shell: bash
        run: pytest

      - name: Shell scripts
        shell: bash
        run: shellcheck install.sh wireless.sh scripts/**/*.sh

      - name: Markdown documentation
        shell: bash
        run: npx --yes markdownlint-cli@0.45.0 README.md docs/**/*.md

      - name: JSON configuration
        shell: bash
        run: |
          set -euo pipefail
          json_files=()
          for dir in config .vscode; do
            if [[ -d "$dir" ]]; then
              while IFS= read -r -d '' file; do
                json_files+=("$file")
              done < <(find "$dir" -name '*.json' -print0)
            fi
          done

          if ((${#json_files[@]} > 0)); then
            jq empty "${json_files[@]}"
          fi

      - name: YAML configuration
        shell: bash
        run: yamllint .github/workflows/*.yml .yamllint

      - name: GitHub Actions syntax
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca  # v1.7.12

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
