name: Validate Core Files

on:
  workflow_dispatch:
  push:
    paths:
      - wireless.sh
      - install.sh
      - com.computernetworkbasics.wifionoff.plist
  pull_request:
    paths:
      - wireless.sh
      - install.sh
      - com.computernetworkbasics.wifionoff.plist

permissions:
  contents: read

concurrency:
  group: validate-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Install validation tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck libxml2-utils

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail

          test -f wireless.sh
          test -f install.sh
          grep -q '^#!/bin/bash' wireless.sh
          grep -q '^#!/bin/bash' install.sh
          shellcheck wireless.sh install.sh
          grep -q 'networksetup' wireless.sh
          grep -q 'setairportpower' wireless.sh
          grep -q '/Library/Scripts/NetBasics' install.sh
          grep -q '/Library/LaunchDaemons' install.sh

      - name: Validate plist file
        shell: bash
        run: |
          set -euo pipefail

          plist="com.computernetworkbasics.wifionoff.plist"
          test -f "$plist"
          xmllint --noout "$plist"
          grep -q '<key>Label</key>' "$plist"
          grep -q '<key>ProgramArguments</key>' "$plist"
          grep -q '<key>WatchPaths</key>' "$plist"
          grep -q '/Library/Scripts/NetBasics/wireless.sh' "$plist"
          grep -q '/Library/Preferences/SystemConfiguration' "$plist"

      - name: Validate macOS compatibility markers
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'get_os_version()' wireless.sh
          grep -Fq -- '-r | awk -F.' wireless.sh
          grep -q 'MINIMUM_DARWIN_MAJOR=23' wireless.sh
          grep -q 'TESTED_DARWIN_MAJOR=27' wireless.sh
          grep -q 'get_enabled_service_interfaces' wireless.sh
          grep -q 'get_hardware_interfaces' wireless.sh
          grep -q 'get_interface_type' wireless.sh
          if grep -Eq 'SUPPORTED_ADAPTERS|get_vlan_interfaces|23\|24\|25' wireless.sh; then
            echo 'Legacy hardcoded adapter or OS allowlist found' >&2
            exit 1
          fi
