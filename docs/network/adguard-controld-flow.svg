<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">AdGuard and Control D traffic flow</title>
  <desc id="desc">Mac applications pass through AdGuard HTTPS inspection and local filters. Blocked advertising and tracking traffic stops locally. Allowed DNS is sent to Gold Control D over HTTPS. AdGuard HTTPS exclusions bypass inspection.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081725"/>
      <stop offset="1" stop-color="#102b3b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#80d9df"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff7188"/>
    </marker>
    <style>
      .title{font:700 38px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}
      .subtitle{font:400 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#b9ceda}
      .stage{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}
      .body{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#d7e6ec}
      .badge{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1600" height="600" rx="28" fill="url(#bg)"/>
  <circle cx="1450" cy="80" r="180" fill="#0c6872" opacity=".13"/>
  <circle cx="130" cy="555" r="210" fill="#d0a62c" opacity=".06"/>

  <text x="80" y="78" class="title">AdGuard + Control D: current macOS filtering path</text>
  <text x="80" y="112" class="subtitle">Local HTTPS and DNS filtering first. Only allowed DNS leaves the Mac over encrypted DoH.</text>

  <path d="M350 280H430 M710 280H790 M1070 280H1150" stroke="#80d9df" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="180" width="280" height="200" rx="24" fill="#15324a" stroke="#56c7d9" stroke-width="3"/>
    <circle cx="115" cy="225" r="24" fill="#56c7d9"/><text x="115" y="233" text-anchor="middle" class="stage" fill="#081725">1</text>
    <text x="150" y="233" class="stage">Mac applications</text>
    <text x="105" y="286" class="body">Safari and browsers</text>
    <text x="105" y="318" class="body">Native applications</text>
    <text x="105" y="350" class="body">Pandora + all helpers</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="430" y="180" width="280" height="200" rx="24" fill="#0d5961" stroke="#67e8d0" stroke-width="3"/>
    <circle cx="475" cy="225" r="24" fill="#67e8d0"/><text x="475" y="233" text-anchor="middle" class="stage" fill="#08333a">2</text>
    <text x="510" y="233" class="stage">HTTPS inspection</text>
    <text x="465" y="286" class="body">Network Extension active</text>
    <text x="465" y="318" class="body">Personal CA trusted</text>
    <text x="465" y="350" class="body">Exclusions preserved</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="790" y="180" width="280" height="200" rx="24" fill="#0d5961" stroke="#67e8d0" stroke-width="3"/>
    <circle cx="835" cy="225" r="24" fill="#67e8d0"/><text x="835" y="233" text-anchor="middle" class="stage" fill="#08333a">3</text>
    <text x="870" y="233" class="stage">Local filter lists</text>
    <text x="825" y="286" class="body">Ads + trackers</text>
    <text x="825" y="318" class="body">Network + cosmetic rules</text>
    <text x="825" y="350" class="body">Security filters</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1150" y="180" width="380" height="200" rx="24" fill="#6a5314" stroke="#f6c85f" stroke-width="3"/>
    <circle cx="1195" cy="225" r="24" fill="#f6c85f"/><text x="1195" y="233" text-anchor="middle" class="stage" fill="#493800">4</text>
    <text x="1230" y="233" class="stage">Gold Control D</text>
    <text x="1185" y="286" class="body">DNS over HTTPS</text>
    <text x="1185" y="318" class="body">Allowed queries only</text>
    <text x="1185" y="350" class="body">No local DNSCrypt hop</text>
  </g>

  <path d="M930 380V452H1020" stroke="#ff7188" stroke-width="5" fill="none" marker-end="url(#redArrow)"/>
  <rect x="1025" y="423" width="330" height="62" rx="18" fill="#651f2b" stroke="#ff7188" stroke-width="2"/>
  <text x="1190" y="461" text-anchor="middle" class="badge" fill="#fff">BLOCKED  ADS + TRACKERS</text>

  <rect x="80" y="510" width="540" height="54" rx="18" fill="#1f2c39" stroke="#8293a5"/>
  <text x="350" y="544" text-anchor="middle" class="body">Intentional exception: disabled USB LAN keeps DNS 192.168.10.1</text>
  <rect x="1085" y="510" width="445" height="54" rx="18" fill="#174b36" stroke="#70d6a0"/>
  <text x="1308" y="544" text-anchor="middle" class="badge" fill="#d9ffe9">ALLOWED  ENCRYPTED DNS</text>
</svg>
