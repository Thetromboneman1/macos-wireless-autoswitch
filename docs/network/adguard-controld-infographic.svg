    <path d="M475 352H525" stroke="#78d5dc" stroke-width="4"/><path d="M518 344l12 8-12 8" fill="#78d5dc"/>
    <rect x="530" y="315" width="195" height="74" rx="16" fill="#6a5314" stroke="#f6c85f"/>
    <text x="627" y="347" text-anchor="middle" class="body">Gold Control D</text><text x="627" y="372" text-anchor="middle" class="small">Encrypted DoH</text>
