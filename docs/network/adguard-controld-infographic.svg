<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AdGuard HTTPS filtering optimization infographic</title>
  <desc id="desc">Summary of the August 18 2026 AdGuard and Control D remediation, including Pandora root cause, current filtering settings, validation evidence, retired DNSCrypt components, and the intentional disabled USB LAN DNS exception.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071521"/><stop offset="1" stop-color="#15384a"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0b6670"/><stop offset="1" stop-color="#154f63"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000" flood-opacity=".26"/></filter>
    <style>
      .h1{font:800 46px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}
      .h2{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}
      .body{font:400 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#d7e8ee}
      .small{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#b9ced8}
      .metric{font:800 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}
      .ok{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#b7f7d0;letter-spacing:.6px}
      .warn{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#ffd1d9;letter-spacing:.6px}
    </style>
  </defs>
  <rect width="1600" height="900" rx="30" fill="url(#bg)"/>
  <circle cx="1430" cy="40" r="240" fill="#44c8d4" opacity=".08"/>
  <circle cx="80" cy="850" r="220" fill="#f6c85f" opacity=".06"/>

